# Builds the VPM listing (index.json) and its landing page from every release
# zip in this repo and deploys them to GitHub Pages. Listing info comes from
# apps/unity/vpm/source.json; the page template is apps/unity/vpm/Website.
name: Build VPM Listing

on:
  workflow_dispatch:
  # Releases made by Build SDK Release use GITHUB_TOKEN, which does not fire
  # release events, so chain on the workflow instead
  workflow_run:
    workflows: [Build SDK Release]
    types: [completed]
  release:
    types: [published, edited, unpublished, deleted]
  push:
    branches: [main]
    paths:
      - apps/unity/vpm/**
      - .github/workflows/build-listing.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  listingPath: apps/unity/vpm
  pathToCi: ci

jobs:
  build-listing:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout package-list-action
        uses: actions/checkout@v7
        with:
          repository: vrchat-community/package-list-action
          ref: cb31c3b5d17d1070d7741c61de2ca1b219224039
          path: ${{ env.pathToCi }}
          clean: false

      # package-list-action targets net6.0 and net8.0 only
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.pathToCi }}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('ci/**/global.json', 'ci/**/*.csproj') }}

      # Renders index.html and app.js in place, next to the new index.json
      - name: Build listing
        run: |
          "$pathToCi/build.cmd" BuildRepoListing \
            --root "$pathToCi" \
            --package-listing-source-folder "$GITHUB_WORKSPACE/$listingPath" \
            --list-publish-directory "$GITHUB_WORKSPACE/$listingPath/Website"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.listingPath }}/Website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
