name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: release

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      appVersion: ${{ steps.version.outputs.appVersion }}
      sdkVersion: ${{ steps.version.outputs.sdkVersion }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Read versions
        id: version
        run: |
          appVersion=$(cd apps/desktop && bun -e "const { default: config } = await import('./electrobun.config.ts'); console.log(config.app.version)")
          sdkVersion=$(jq -r .version apps/unity/Packages/app.easydonate.sdk/package.json)
          date=$(TZ=Asia/Bangkok date +%d%m%Y)
          last=$(git ls-remote --tags --refs origin "refs/tags/Release-$date*" \
            | sed -nE "s|.*refs/tags/Release-$date(-([0-9]+))?$|\2|p" \
            | sed 's/^$/1/' | sort -n | tail -n1)
          tag="Release-$date-$(( ${last:-0} + 1 ))"
          prerelease=false
          if [[ $appVersion == *-* || $sdkVersion == *-* ]]; then
            prerelease=true
          fi
          {
            echo "tag=$tag"
            echo "appVersion=$appVersion"
            echo "sdkVersion=$sdkVersion"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  sdk:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      version: ${{ needs.prepare.outputs.sdkVersion }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true

      - name: Set file names
        run: |
          mkdir out
          {
            echo "zipFile=app.easydonate.sdk-$version.zip"
            echo "unityPackage=app.easydonate.sdk-$version.unitypackage"
          } >> "$GITHUB_ENV"

      - name: Create package zip
        working-directory: apps/unity/Packages/app.easydonate.sdk
        run: zip -r "$GITHUB_WORKSPACE/out/$zipFile" .

      - name: List package meta files
        working-directory: apps/unity
        run: find Packages/app.easydonate.sdk -name '*.meta' > metaList

      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          working-folder: apps/unity
          package-path: ../../out/${{ env.unityPackage }}
          include-files: metaList

      - name: Upload SDK files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sdk
          path: out/
          if-no-files-found: error

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win-x64
            installer: '*-Setup.zip'
          - runner: macos-latest
            target: macos-arm64
            installer: '*.dmg'
            signingIdentity: '-'
          - runner: ubuntu-latest
            target: linux-x64
            installer: '*-Setup.tar.gz'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run --bun build
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ matrix.signingIdentity }}

      - name: Upload desktop files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/artifacts/${{ matrix.installer }}
            apps/desktop/artifacts/stable-*
          if-no-files-found: error

  release:
    needs: [prepare, sdk, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      tag: ${{ needs.prepare.outputs.tag }}
      appVersion: ${{ needs.prepare.outputs.appVersion }}
      sdkVersion: ${{ needs.prepare.outputs.sdkVersion }}
      prerelease: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8.0.2
        with:
          path: out
          merge-multiple: true

      - name: Skip released SDK zip
        run: |
          zipFile="app.easydonate.sdk-$sdkVersion.zip"
          assets=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[].assets[].name')
          if grep -qxF "$zipFile" <<< "$assets"; then
            echo "::notice::SDK $sdkVersion is already released, so $zipFile is not attached again."
            rm "out/$zipFile"
          fi

      - name: Create release
        run: |
          downloadUrl="https://github.com/$GH_REPO/releases/download/$tag"
          cat > notes.md <<EOF
          ## Versions

          - EasyDonate Connect: $appVersion
          - EasyDonate SDK: $sdkVersion

          ## Desktop app

          - Windows: download [here]($downloadUrl/win-x64-EasyDonateConnect-Setup.zip)
          - macOS (Apple silicon): download [here]($downloadUrl/macos-arm64-EasyDonateConnect.dmg)
          - Linux (x64): download [here]($downloadUrl/linux-x64-EasyDonateConnect-Setup.tar.gz)

          ## SDK

          Install with VCC: add https://easydonate-th.github.io/connect/index.json to your repositories, or import app.easydonate.sdk-$sdkVersion.unitypackage
          EOF
          flags=()
          if [[ $prerelease == true ]]; then
            flags=(--prerelease)
          fi
          shopt -s extglob
          gh release create "$tag" out/!(*.patch) \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file notes.md \
            "${flags[@]}"

      - name: Upload update files
        if: env.prerelease == 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: https://nozomi.easydonate.app
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws configure set default.s3.addressing_style path
          upload() {
            aws s3 cp out s3://connect/ --recursive --no-progress \
              --exclude '*' --include "$1" \
              --content-type "$2" --cache-control no-cache
          }
          upload 'stable-*.patch' application/octet-stream
          upload 'stable-*.tar.zst' application/octet-stream
          upload 'stable-*-update.json' application/json

      - name: Publish release
        run: gh release edit "$tag" --draft=false

  listing:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: vrchat-community/package-list-action
          ref: cb31c3b5d17d1070d7741c61de2ca1b219224039
          path: ci
          clean: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ci/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('ci/**/global.json', 'ci/**/*.csproj') }}

      - name: Build listing
        run: |
          ci/build.cmd BuildRepoListing \
            --root ci \
            --package-listing-source-folder "$GITHUB_WORKSPACE/apps/unity/vpm" \
            --list-publish-directory "$GITHUB_WORKSPACE/apps/unity/vpm/Website"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/unity/vpm/Website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
