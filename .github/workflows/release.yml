name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: release

env:
  projectPath: apps/unity
  packageName: app.easydonate.sdk
  listingPath: apps/unity/vpm
  pathToCi: ci

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      appVersion: ${{ steps.version.outputs.appVersion }}
      sdkVersion: ${{ steps.version.outputs.sdkVersion }}
      sdkChanged: ${{ steps.changes.outputs.sdk }}
      listingChanged: ${{ steps.changes.outputs.listing }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The change check diffs against the last release's tag
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Read versions
        id: version
        run: |
          appVersion=$(cd apps/desktop && bun -e "const { default: config } = await import('./electrobun.config.ts'); console.log(config.app.version)")
          sdkVersion=$(jq -r .version "$projectPath/Packages/$packageName/package.json")
          date=$(TZ=Asia/Bangkok date +%d%m%Y)
          last=$(git ls-remote --tags --refs origin "refs/tags/Release-$date*" \
            | sed -nE "s|.*refs/tags/Release-$date(-([0-9]+))?$|\2|p" \
            | sed 's/^$/1/' | sort -n | tail -n1)
          tag="Release-$date-$(( ${last:-0} + 1 ))"
          {
            echo "tag=$tag"
            echo "appVersion=$appVersion"
            echo "sdkVersion=$sdkVersion"
          } >> "$GITHUB_OUTPUT"

      - name: Check changes
        id: changes
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          lastTag=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          changed() {
            [[ -z $lastTag ]] || ! git diff --quiet "$lastTag" HEAD -- "$1"
          }
          sdk=true
          if ! changed "$projectPath/Packages/$packageName"; then
            sdk=false
            echo "::notice::The SDK did not change since $lastTag, so it is not built."
          fi
          listing=true
          if [[ $sdk == false ]] && ! changed "$listingPath"; then
            listing=false
            echo "::notice::The SDK and $listingPath did not change since $lastTag, so the listing is not deployed."
          fi
          {
            echo "sdk=$sdk"
            echo "listing=$listing"
          } >> "$GITHUB_OUTPUT"

  sdk:
    needs: prepare
    if: needs.prepare.outputs.sdkChanged == 'true'
    runs-on: ubuntu-latest
    env:
      version: ${{ needs.prepare.outputs.sdkVersion }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true

      - name: Set file names
        run: |
          mkdir out
          {
            echo "zipFile=$packageName-$version.zip"
            echo "unityPackage=$packageName-$version.unitypackage"
          } >> "$GITHUB_ENV"

      - name: Create package zip
        working-directory: ${{ env.projectPath }}/Packages/${{ env.packageName }}
        run: zip -r "$GITHUB_WORKSPACE/out/$zipFile" .

      - name: List package meta files
        working-directory: ${{ env.projectPath }}
        run: find "Packages/$packageName" -name '*.meta' > metaList

      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          working-folder: ${{ env.projectPath }}
          package-path: ../../out/${{ env.unityPackage }}
          include-files: metaList

      - name: Upload SDK files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sdk
          path: out/
          if-no-files-found: error

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win-x64
            installer: '*-Setup.zip'
          # Pinned, since the macos-latest alias can move to another macOS
          - runner: macos-15
            target: macos-arm64
            installer: '*.dmg'
            # "-" signs ad hoc, which needs no Apple Developer ID
            signingIdentity: '-'
          - runner: ubuntu-latest
            target: linux-x64
            installer: '*-Setup.tar.gz'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run --bun build
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ matrix.signingIdentity }}

      - name: Upload desktop files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: apps/desktop/artifacts/${{ matrix.installer }}
          if-no-files-found: error

  release:
    needs: [prepare, sdk, desktop]
    # Runs when the sdk job is skipped too
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      tag: ${{ needs.prepare.outputs.tag }}
      appVersion: ${{ needs.prepare.outputs.appVersion }}
      sdkVersion: ${{ needs.prepare.outputs.sdkVersion }}
      sdkBuilt: ${{ needs.sdk.result == 'success' }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8.0.2
        with:
          path: out
          merge-multiple: true

      - name: Skip released SDK zip
        if: env.sdkBuilt == 'true'
        run: |
          zipFile="$packageName-$sdkVersion.zip"
          assets=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[].assets[].name')
          if grep -qxF "$zipFile" <<< "$assets"; then
            echo "::notice::SDK $sdkVersion is already released, so $zipFile is not attached again."
            rm "out/$zipFile"
          fi

      - name: Create release
        run: |
          cat > notes.md <<EOF
          ## Versions

          - EasyDonate Connect: $appVersion
          - EasyDonate SDK: $sdkVersion

          ## Desktop app

          - Windows: download win-x64-EasyDonateConnect-Setup.zip, extract it and run EasyDonate Connect-Setup.exe
          - macOS (Apple silicon): download macos-arm64-EasyDonateConnect.dmg, open it and drag EasyDonate Connect to Applications
          - Linux (x64): download linux-x64-EasyDonateConnect-Setup.tar.gz, extract it and run installer

          MIDI works on Windows only
          EOF
          if [[ $sdkBuilt == true ]]; then
            cat >> notes.md <<EOF

          ## SDK

          Install with VCC: add https://easydonate-th.github.io/connect/index.json to your repositories, or import $packageName-$sdkVersion.unitypackage. Both include the example prefabs in the package's Examples folder
          EOF
          fi
          prerelease=()
          if [[ $appVersion == *-* || $sdkVersion == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$tag" out/* \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file notes.md \
            "${prerelease[@]}"

  # Lists the SDK versions in the release zips, so it runs once the release
  # exists, and only when the SDK or the listing source changed
  listing:
    needs: [prepare, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.prepare.outputs.listingChanged == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Checkout package-list-action
        uses: actions/checkout@v7.0.1
        with:
          repository: vrchat-community/package-list-action
          ref: cb31c3b5d17d1070d7741c61de2ca1b219224039 # main, 2025-01-21
          path: ${{ env.pathToCi }}
          clean: false

      # package-list-action targets net6.0 and net8.0 only
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ env.pathToCi }}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('ci/**/global.json', 'ci/**/*.csproj') }}

      # Renders index.html and app.js in place, next to the new index.json
      - name: Build listing
        run: |
          "$pathToCi/build.cmd" BuildRepoListing             --root "$pathToCi"             --package-listing-source-folder "$GITHUB_WORKSPACE/$listingPath"             --list-publish-directory "$GITHUB_WORKSPACE/$listingPath/Website"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ env.listingPath }}/Website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
