name: Build Desktop Release

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash
    working-directory: apps/desktop

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read app version
        run: |
          version=$(bun -e "const { default: config } = await import('./electrobun.config.ts'); console.log(config.app.version)")
          tag="desktop-v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag already exists. Bump app.version in electrobun.config.ts first."
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_ENV"

      - name: Build
        run: bun run --bun build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ $version == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$tag" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "EasyDonate Connect $version" \
            --notes "Download win-x64-EasyDonateConnect-Setup.zip, extract it and run EasyDonate Connect-Setup.exe." \
            "${prerelease[@]}"
