name: Build SDK Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  projectPath: apps/unity
  packageName: app.easydonate.sdk

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read package version
        run: |
          version=$(jq -r .version "$projectPath/Packages/$packageName/package.json")
          tag="sdk-v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag already exists. Bump the version in package.json first."
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "zipFile=$packageName-$version.zip"
            echo "unityPackage=$packageName-$version.unitypackage"
          } >> "$GITHUB_ENV"

      # VCC reads package.json from the zip root, so zip the package's contents
      - name: Create package zip
        working-directory: ${{ env.projectPath }}/Packages/${{ env.packageName }}
        run: zip -r "$GITHUB_WORKSPACE/$zipFile" .

      # Paths are relative to the Unity project, so the .unitypackage imports
      # into Packages/app.easydonate.sdk
      - name: List package meta files
        working-directory: ${{ env.projectPath }}
        run: find "Packages/$packageName" -name '*.meta' > metaList

      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          working-folder: ${{ env.projectPath }}
          package-path: ../../${{ env.unityPackage }}
          include-files: metaList

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$tag" \
            "$zipFile" \
            "$unityPackage" \
            "$projectPath/Packages/$packageName/package.json" \
            --target "$GITHUB_SHA" \
            --title "EasyDonate SDK $version" \
            --notes "Install with VCC: add https://easydonate-th.github.io/connect/index.json to your repositories, or import the .unitypackage."
